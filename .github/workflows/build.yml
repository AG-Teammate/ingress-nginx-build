name: Build ingress-nginx

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to publish (what your Helm values point at)'
        required: true
        default: 'v1.15.1'
      source_ref:
        description: 'chainguard-forks/ingress-nginx ref to build from (main has Makefile fixes)'
        required: true
        default: 'main'

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: chainguard-forks/ingress-nginx
          ref: ${{ inputs.source_ref }}

      - id: owner
        run: echo "name=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: 'GOLANG_VERSION'

      - run: go install github.com/magefile/mage@latest

      - name: make release
        env:
          REGISTRY: ghcr.io/${{ steps.owner.outputs.name }}
          TAG: ${{ inputs.image_tag }}
        run: make release

      - run: |
          {
            echo "## Pushed"
            echo '- `ghcr.io/${{ steps.owner.outputs.name }}/controller:${{ inputs.image_tag }}`'
            echo '- `ghcr.io/${{ steps.owner.outputs.name }}/controller-chroot:${{ inputs.image_tag }}`'
            echo ''
            echo "Built from \`chainguard-forks/ingress-nginx@${{ inputs.source_ref }}\` (commit \`$(git rev-parse --short HEAD)\`)"
          } >> $GITHUB_STEP_SUMMARY