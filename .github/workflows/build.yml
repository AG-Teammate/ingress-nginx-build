# Proposed replacement for AG-Teammate/ingress-nginx-build/.github/workflows/build.yml
#
# Why: `make release` in the fork takes its nginx from the NGINX_BASE file, which still
# points at the upstream registry.k8s.io/ingress-nginx/nginx:v2.2.8 image (built
# 2026-03-08). That image contains none of the fork's nginx CVE backports. This
# workflow first builds the fork's patched nginx base (images/nginx/rootfs, which
# applies images/nginx/rootfs/patches/*), then builds the controller on top of it.
#
# amd64 only: all tm-k8s-ash nodes are amd64, and compiling nginx for arm under
# QEMU would take hours.
name: Build ingress-nginx

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to publish (what your Helm values point at)'
        required: true
      source_ref:
        description: 'chainguard-forks/ingress-nginx ref to build from (release tag or main)'
        required: true
        default: 'controller-v1.15.16'

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          repository: chainguard-forks/ingress-nginx
          ref: ${{ inputs.source_ref }}

      - id: vars
        run: |
          owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          echo "registry=ghcr.io/$owner" >> "$GITHUB_OUTPUT"
          echo "nginx_image=ghcr.io/$owner/nginx:$(cat images/nginx/TAG)-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Show the nginx patch stack being built
        run: ls images/nginx/rootfs/patches | tail -15

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the patched nginx base
        id: nginx
        uses: docker/build-push-action@v6
        with:
          context: images/nginx/rootfs
          platforms: linux/amd64
          push: true
          tags: ${{ steps.vars.outputs.nginx_image }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: 'GOLANG_VERSION'

      - run: go install github.com/magefile/mage@latest

      - name: make release (controller on the patched base)
        env:
          REGISTRY: ${{ steps.vars.outputs.registry }}
          TAG: ${{ inputs.image_tag }}
          BASE_IMAGE: ${{ steps.vars.outputs.nginx_image }}@${{ steps.nginx.outputs.digest }}
          PLATFORMS: amd64
          BUILDX_PLATFORMS: linux/amd64
        run: make release

      - name: Verify the controller image carries the freshly built nginx
        run: |
          docker run --rm --entrypoint sh "${{ steps.vars.outputs.registry }}/controller:${{ inputs.image_tag }}" -c \
            'nginx -v; stat -c "nginx binary built: %y" /usr/local/nginx/sbin/nginx' | tee verify.txt
          grep -q "built: $(date -u +%Y-%m-%d)" verify.txt

      - run: |
          {
            echo "## Pushed"
            echo '- `${{ steps.vars.outputs.registry }}/controller:${{ inputs.image_tag }}`'
            echo '- `${{ steps.vars.outputs.registry }}/controller-chroot:${{ inputs.image_tag }}`'
            echo '- nginx base: `${{ steps.vars.outputs.nginx_image }}@${{ steps.nginx.outputs.digest }}`'
            echo ''
            echo 'Built from `chainguard-forks/ingress-nginx@${{ inputs.source_ref }}` (commit `${{ steps.vars.outputs.sha }}`), linux/amd64 only.'
            echo ''
            echo '```'
            cat verify.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
